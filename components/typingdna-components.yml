generated: '2026-07-21'
method: searched
source: >-
  https://verify.typingdna.com/docs (Integrate Frontend section) and
  https://api.typingdna.com/docs/index.html (TypingDNA class). Loader URLs
  captured verbatim.
description: >-
  Client-side / embeddable surfaces TypingDNA ships: the Verify 2FA pop-up
  button and iframe, and the open-source typing-pattern recorder classes.
families:
  - family: Verify 2FA embeds
    loader: https://cdn.typingdna.com/verify/typingdna-verify.js
    components:
      - name: Verify 2FA button
        kind: button (opens pop-up window)
        markup: '<button class="typingdna-verify" data-typingdna-client-id data-typingdna-application-id data-typingdna-payload data-typingdna-callback-fn>'
        notes: Mandatory data attributes are generated by the backend client getDataAttributes(); callback receives {success, otp|error}.
      - name: Verify 2FA iframe
        kind: iframe (embedded)
        sizes: [468x598 standard, 300x200 compact (data-typingdna-compact="on")]
        notes: Show-OTP flow not available in iframe mode; data is posted only to the domain registered on the Application.
  - family: Typing pattern recorders
    components:
      - name: TypingDNA JavaScript recorder (typingdna.js)
        kind: JS class (Apache 2.0, open source)
        loader: https://api.typingdna.com/scripts/typingdna.js
        alt_loader: https://www.typingdna.com/scripts/typingdna.js
        methods: [getTypingPattern, addTarget, removeTarget, start, stop, reset, getQuality, getTextId]
      - name: Mobile recorders
        kind: native SDKs
        platforms: [Android (TypingDNARecorder-Android), iOS (TypingDNARecorder-iOS), React Native (typingdnarecorder-react-native)]
        notes: Capture motion-sensor data alongside keystrokes; require sensor permissions.
  - family: End-user tools
    components:
      - name: TypingDNA 2FA Authenticator
        kind: Chrome extension (TOTP authenticator secured by typing biometrics)
        url: https://www.typingdna.com/authenticator
